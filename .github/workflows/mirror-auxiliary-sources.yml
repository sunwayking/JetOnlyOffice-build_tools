name: Mirror auxiliary source repositories

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - upstream: ONLYOFFICE/core
            target: JetOnlyOffice-core
          - upstream: ONLYOFFICE/core-fonts
            target: JetOnlyOffice-core-fonts
          - upstream: ONLYOFFICE/dictionaries
            target: JetOnlyOffice-dictionaries
          - upstream: ONLYOFFICE/server
            target: JetOnlyOffice-server
          - upstream: ONLYOFFICE/sdkjs-forms
            target: JetOnlyOffice-sdkjs-forms
          - upstream: ONLYOFFICE/onlyoffice.github.io
            target: JetOnlyOffice-onlyoffice.github.io
          - upstream: ONLYOFFICE/document-server-integration
            target: JetOnlyOffice-document-server-integration
          - upstream: ONLYOFFICE/document-templates
            target: JetOnlyOffice-document-templates
          - upstream: ONLYOFFICE/document-formats
            target: JetOnlyOffice-document-formats
          - upstream: ONLYOFFICE/document-server-package
            target: JetOnlyOffice-document-server-package
          - upstream: ONLYOFFICE/plugin-aiautofill
            target: JetOnlyOffice-plugin-aiautofill
          - upstream: DomGries/InnoDependencyInstaller
            target: JetOnlyOffice-InnoDependencyInstaller
          - upstream: ONLYOFFICE/Docker-DocumentServer
            target: JetOnlyOffice-Docker-DocumentServer
          - upstream: ONLYOFFICE-data/build_tools_data
            target: JetOnlyOffice-build_tools_data
    env:
      MIRROR_TOKEN: ${{ secrets.JETONLYOFFICE_MIRROR_TOKEN }}
    steps:
      - name: Check out locked mirror tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Require an explicit cross-repository token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MIRROR_TOKEN}"

      - name: Copy complete history without mirror push
        shell: bash
        env:
          UPSTREAM: ${{ matrix.upstream }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          git clone --mirror "https://github.com/${UPSTREAM}.git" source.git
          git -C source.git fsck --full --strict

          while read -r ref object; do
            name="${ref#refs/heads/}"
            git -C source.git update-ref "refs/heads/upstream/${name}" "${object}"
            git -C source.git update-ref -d "${ref}"
          done < <(git -C source.git for-each-ref --format='%(refname) %(objectname)' refs/heads)

          auth_header="$(printf 'x-access-token:%s' "${MIRROR_TOKEN}" | base64 -w 0)"
          echo "::add-mask::${auth_header}"
          target_url="https://github.com/sunwayking/${TARGET}.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"

          git -C source.git push \
            "${target_url}" 'refs/heads/upstream/*:refs/heads/upstream/*'
          MIRROR_TAG_BATCH_SIZE=100 \
            ./scripts/mirror-tags.sh source.git "${target_url}"

          {
            echo "### ${UPSTREAM}"
            echo
            echo "- target: sunwayking/${TARGET}"
            echo "- heads: $(git -C source.git for-each-ref refs/heads --format='%(refname)' | wc -l)"
            echo "- tags: $(git -C source.git for-each-ref refs/tags --format='%(refname)' | wc -l)"
            echo "- object check: full strict"
          } >> "${GITHUB_STEP_SUMMARY}"
